name: speech-round1

# Round 1 of the speech benchmark on the open (ungated) public sources:
# FLEURS Hindi + English and MUCS 2021 Hindi-English. Desktop CPU accuracy only.
# Results are committed to evals/reports/ on this branch so they can be read
# without access to the Actions UI. Gated sources (IndicVoices, Lahaja, Svarah,
# Kathbath) join once the HF_TOKEN secret exists.

on:
  workflow_dispatch:
  push:
    branches: [ml/hindi-speech-baseline]
    paths:
      - ".github/workflows/speech-round1.yml"
      - "evals/speech/round1/TRIGGER"

concurrency:
  group: speech-round1
  cancel-in-progress: true

permissions:
  contents: write

env:
  GOLDEN: ${{ github.workspace }}/golden
  AUDIO: ${{ github.workspace }}/golden-audio

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build golden set from open sources
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          {
            set -ex
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
            pip install -q numpy==2.1.3
            python3 -m unittest discover -s evals/speech -v
            mkdir -p dl && cd dl
            for lang in hi_in en_us; do
              mkdir -p fleurs_$lang
              curl -fsSL -o fleurs_$lang/test.tsv https://huggingface.co/datasets/google/fleurs/resolve/main/data/$lang/test.tsv
              curl -fsSL https://huggingface.co/datasets/google/fleurs/resolve/main/data/$lang/audio/test.tar.gz | tar -xz -C fleurs_$lang
              head -c 600 fleurs_$lang/test.tsv; echo
            done
            mkdir -p mucs
            curl -fsSL https://openslr.trmal.net/resources/104/Hindi-English_test.tar.gz -o mucs.tgz \
              || curl -fsSL https://openslr.elda.org/resources/104/Hindi-English_test.tar.gz -o mucs.tgz
            tar -xzf mucs.tgz -C mucs && rm mucs.tgz
            find mucs -maxdepth 4 | head -40
            cd ..
            python3 evals/speech/to_kaldi.py fleurs dl/fleurs_hi_in k/fleurs_hi
            python3 evals/speech/to_kaldi.py fleurs dl/fleurs_en_us k/fleurs_en
            python3 evals/speech/to_kaldi.py mucs dl/mucs k/mucs
            python3 evals/speech/prepare_public_set.py --out "$GOLDEN" --audio-out "$AUDIO" \
              --sources fleurs_hi,mucs,fleurs_en \
              --local fleurs_hi=k/fleurs_hi --local fleurs_en=k/fleurs_en --local mucs=k/mucs
            wc -l "$GOLDEN/manifest.jsonl"
            head -3 "$GOLDEN/manifest.jsonl"
            for id in $(grep -o '"id": "mucs[^"]*"' "$GOLDEN/manifest.jsonl" | head -3 | cut -d'"' -f4); do cat "$GOLDEN/refs/$id.txt"; done
          } 2>&1 | tee logs/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: golden
          path: |
            golden
            golden-audio
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-build
          path: logs/

  transcribe:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: "openai/whisper-small", slug: "whisper-small", langs: "hi,en"}
          - {model: "vasista22/whisper-hindi-small", slug: "whisper-hindi-small-vasista22", langs: "hi"}
          - {model: "Oriserve/Whisper-Hindi2Hinglish-Prime", slug: "hindi2hinglish-prime", langs: "hi"}
          - {model: "openai/whisper-large-v3-turbo", slug: "whisper-large-v3-turbo-ceiling", langs: "hi,en"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: golden
          path: .
      - name: Transcribe and score
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs out/${{ matrix.slug }}
          {
            set -ex
            pip install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
            pip install -q transformers==4.46.3 numpy==2.1.3
            python3 evals/speech/transcribe_hf.py --golden "$GOLDEN" --audio "$AUDIO" \
              --hyps hyps --model "${{ matrix.model }}" --langs "${{ matrix.langs }}"
            cp hyps/_timing.json out/${{ matrix.slug }}/timing.json
            python3 evals/speech/run_speech_eval.py --golden "$GOLDEN" --hyps hyps \
              --langs "${{ matrix.langs }}" --engine transformers --model "${{ matrix.model }}" \
              --device "github-ubuntu-cpu" --out out/${{ matrix.slug }}/results.jsonl \
              --summary out/${{ matrix.slug }}/summary.json --missing empty
          } 2>&1 | tee logs/${{ matrix.slug }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.slug }}
          path: |
            out/
            logs/

  report:
    needs: [build, transcribe]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ml/hindi-speech-baseline
      - uses: actions/download-artifact@v4
        with:
          pattern: "result-*"
          path: art
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: log-build
          path: art/log-build
      - name: Write and commit report
        shell: bash
        run: |
          set -x
          R=evals/reports/speech-round1
          rm -rf "$R" && mkdir -p "$R/logs" "$R/results"
          for d in art/result-*; do
            [ -d "$d/out" ] && cp -r "$d"/out/* "$R/results/" || true
            for l in "$d"/logs/*.log; do [ -f "$l" ] && tail -n 120 "$l" > "$R/logs/$(basename "$l")"; done
          done
          [ -f art/log-build/build.log ] && tail -n 200 art/log-build/build.log > "$R/logs/build.log"
          # keep results small: drop raw per-clip rows over 2 MB
          find "$R/results" -name results.jsonl -size +2M -delete
          {
            echo "# Speech round 1 (desktop CPU, open sources)"
            echo
            echo "Run: ${{ github.run_id }} on commit ${{ github.sha }}, $(date -u +%Y-%m-%dT%H:%MZ)."
            echo "Jobs: build=${{ needs.build.result }}, transcribe=${{ needs.transcribe.result }}."
            echo
            python3 evals/speech/round_report.py "$R/results" /tmp/table.md >/dev/null 2>&1 && cat /tmp/table.md || echo "No model results; see logs/."
          } > "$R/README.md"
          git config user.name "kloo-ci"
          git config user.email "kloo-ci@users.noreply.github.com"
          git add "$R"
          git commit -m "Speech round 1 results (run ${{ github.run_id }}) [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin ml/hindi-speech-baseline && git push origin HEAD:ml/hindi-speech-baseline && break; sleep 5; done
