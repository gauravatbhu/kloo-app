name: speech-round2

# Round 2 of the speech benchmark: adds the gated natural-speech sets
# (IndicVoices Hindi valid, Lahaja Hindi, Svarah Indian English) via the
# HF_TOKEN secret, the Oriserve Apex model and AI4Bharat IndicConformer.
# Desktop CPU accuracy only. Each job pushes its summary, timing and log to
# ci/speech-results/round2/. Per-clip text from gated datasets is never
# published: their rows are stripped of transcripts before pushing.

on:
  workflow_dispatch:
  push:
    branches: [ml/speech-round2]
    paths:
      - ".github/workflows/speech-round2.yml"
      - "evals/speech/round2/TRIGGER"
      - "evals/speech/round2/ONLY"

concurrency:
  group: speech-round2
  cancel-in-progress: true

permissions:
  contents: write

env:
  GOLDEN: ${{ github.workspace }}/golden
  AUDIO: ${{ github.workspace }}/golden-audio

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download gated sources (token only in this step)
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p logs dl
          {
            pip install -q huggingface_hub==0.26.5 pyarrow==18.1.0
            python3 - <<'PY'
          import os, sys
          from huggingface_hub import snapshot_download
          tok = os.environ.get("HF_TOKEN")
          if not tok:
              print("HF_TOKEN missing: gated sources skipped"); sys.exit(0)
          for name, repo, pattern in [("indicvoices", "ai4bharat/IndicVoices", "hindi/valid-*"),
                                      ("lahaja", "ai4bharat/Lahaja", "data/test-*"),
                                      ("svarah", "ai4bharat/Svarah", "data/test-*")]:
              try:
                  snapshot_download(repo, repo_type="dataset", allow_patterns=[pattern],
                                    local_dir=f"dl/{name}", token=tok)
                  print(f"{name}: downloaded")
              except Exception as e:  # access not granted yet, network, ...
                  print(f"{name}: SKIPPED ({type(e).__name__}: {str(e)[:200]})")
          PY
          } 2>&1 | tee logs/gated.log
      - name: Build golden set
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          {
            set -ex
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
            pip install -q numpy==2.1.3 pyarrow==18.1.0
            cat logs/gated.log
            python3 -m unittest discover -s evals/speech -v
            mkdir -p dl && cd dl
            for lang in hi_in en_us; do
              mkdir -p fleurs_$lang
              curl -fsSL -o fleurs_$lang/test.tsv https://huggingface.co/datasets/google/fleurs/resolve/main/data/$lang/test.tsv
              curl -fsSL https://huggingface.co/datasets/google/fleurs/resolve/main/data/$lang/audio/test.tar.gz | tar -xz -C fleurs_$lang
              head -c 600 fleurs_$lang/test.tsv; echo
            done
            mkdir -p mucs
            curl -fsSL https://openslr.trmal.net/resources/104/Hindi-English_test.tar.gz -o mucs.tgz \
              || curl -fsSL https://openslr.elda.org/resources/104/Hindi-English_test.tar.gz -o mucs.tgz
            tar -xzf mucs.tgz -C mucs && rm mucs.tgz
            find mucs -maxdepth 4 | head -40
            cd ..
            python3 evals/speech/to_kaldi.py fleurs dl/fleurs_hi_in k/fleurs_hi
            python3 evals/speech/to_kaldi.py fleurs dl/fleurs_en_us k/fleurs_en
            python3 evals/speech/to_kaldi.py mucs dl/mucs k/mucs
            SOURCES=fleurs_hi,mucs,fleurs_en
            LOCAL="--local fleurs_hi=k/fleurs_hi --local fleurs_en=k/fleurs_en --local mucs=k/mucs"
            for g in indicvoices lahaja svarah; do
              if [ -d dl/$g ] && python3 evals/speech/to_kaldi.py parquet dl/$g k/$g; then
                SOURCES="$SOURCES,$g"; LOCAL="$LOCAL --local $g=k/$g"; rm -rf dl/$g
              else echo "$g: not available, skipped"; fi
            done
            python3 evals/speech/prepare_public_set.py --out "$GOLDEN" --audio-out "$AUDIO" \
              --sources "$SOURCES" $LOCAL
            wc -l "$GOLDEN/manifest.jsonl"
            head -3 "$GOLDEN/manifest.jsonl"
            for id in $(grep -o '"id": "mucs[^"]*"' "$GOLDEN/manifest.jsonl" | head -3 | cut -d'"' -f4); do cat "$GOLDEN/refs/$id.txt"; done
          } 2>&1 | tee -a logs/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: golden
          path: |
            golden
            golden-audio
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-build
          path: logs/

  transcribe:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: "openai/whisper-small", slug: "whisper-small", langs: "hi,en", limit: "200", script: "hf"}
          - {model: "vasista22/whisper-hindi-small", slug: "whisper-hindi-small-vasista22", langs: "hi", limit: "300", script: "hf"}
          - {model: "Oriserve/Whisper-Hindi2Hinglish-Apex", slug: "hindi2hinglish-apex", langs: "hi", limit: "200", script: "hf"}
          - {model: "Oriserve/Whisper-Hindi2Hinglish-Prime", slug: "hindi2hinglish-prime", langs: "hi", limit: "120", script: "hf"}
          - {model: "ai4bharat/indic-conformer-600m-multilingual", slug: "indicconformer-ctc", langs: "hi", limit: "300", script: "conformer"}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skip models not listed in evals/speech/round2/ONLY (if present)
        id: pick
        shell: bash
        run: |
          if [ -s evals/speech/round2/ONLY ] && ! grep -qx "${{ matrix.slug }}" evals/speech/round2/ONLY; then
            echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.pick.outputs.run == 'true'
        with:
          name: golden
          path: .
      - name: Transcribe and score
        if: steps.pick.outputs.run == 'true'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p logs out/${{ matrix.slug }}
          {
            set -ex
            pip install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
            pip install -q transformers==4.46.3 numpy==2.1.3
            if [ "${{ matrix.script }}" = conformer ]; then
              pip install -q torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
              pip install -q onnxruntime==1.20.1 onnx==1.17.0
              python3 evals/speech/transcribe_conformer.py --golden "$GOLDEN" --audio "$AUDIO" \
                --hyps hyps --model "${{ matrix.model }}" --revision e9b71b369c048e2c6b634d4c131061c34e441179 \
                --decoder ctc --langs "${{ matrix.langs }}" --limit "${{ matrix.limit }}" --max-minutes 270
            else
              python3 evals/speech/transcribe_hf.py --golden "$GOLDEN" --audio "$AUDIO" \
                --hyps hyps --model "${{ matrix.model }}" --langs "${{ matrix.langs }}" --limit "${{ matrix.limit }}" --max-minutes 270
            fi
            cp hyps/_timing.json out/${{ matrix.slug }}/timing.json
            python3 evals/speech/run_speech_eval.py --golden "$GOLDEN" --hyps hyps \
              --langs "${{ matrix.langs }}" --engine transformers --model "${{ matrix.model }}" \
              --device "github-ubuntu-cpu" --out out/${{ matrix.slug }}/results.jsonl \
              --summary out/${{ matrix.slug }}/summary.json --missing skip
          } 2>&1 | tee logs/${{ matrix.slug }}.log
      - name: Push results and log to ci/speech-results
        if: always() && steps.pick.outputs.run == 'true'
        shell: bash
        run: |
          set -x
          mkdir -p logs out/${{ matrix.slug }}
          tail -n 150 logs/${{ matrix.slug }}.log > out/${{ matrix.slug }}/log.txt 2>/dev/null || echo "no log" > out/${{ matrix.slug }}/log.txt
          echo "${{ job.status }} run=${{ github.run_id }} sha=${{ github.sha }}" > out/${{ matrix.slug }}/status.txt
          # Gated datasets: publish scores only, never their transcripts.
          if [ -f out/${{ matrix.slug }}/results.jsonl ]; then
            python3 - out/${{ matrix.slug }}/results.jsonl <<'PY'
          import json, sys
          gated = {"indicvoices", "lahaja", "svarah", "kathbath"}
          p = sys.argv[1]; rows = [json.loads(l) for l in open(p, encoding="utf-8")]
          with open(p, "w", encoding="utf-8") as f:
              for r in rows:
                  if r.get("source") in gated:
                      for k in ("reference", "hypothesis", "raw_reference", "raw_hypothesis"):
                          r.pop(k, None)
                  f.write(json.dumps(r, ensure_ascii=False) + "\n")
          PY
          fi
          find out -name results.jsonl -size +3M -delete
          git config user.name kloo-ci; git config user.email kloo-ci@users.noreply.github.com
          for i in 1 2 3 4 5 6; do
            rm -rf res && git clone -q --depth 1 --branch ci/speech-results "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" res 2>/dev/null \
              || { git init -q res && git -C res checkout -q -b ci/speech-results && git -C res remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"; }
            mkdir -p res/round2 && rm -rf res/round2/${{ matrix.slug }} && cp -r out/${{ matrix.slug }} res/round2/
            git -C res add -A && git -C res -c user.name=kloo-ci -c user.email=kloo-ci@users.noreply.github.com commit -q -m "round2 ${{ matrix.slug }} [skip ci]" || break
            git -C res push -q origin ci/speech-results && break
            sleep $((RANDOM % 20 + 5))
          done

  build-log:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: log-build
          path: logs
      - name: Push build log
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            rm -rf res && git clone -q --depth 1 --branch ci/speech-results "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" res 2>/dev/null \
              || { git init -q res && git -C res checkout -q -b ci/speech-results && git -C res remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"; }
            mkdir -p res/round2 && tail -n 250 logs/build.log > res/round2/build-log.txt 2>/dev/null || echo "no build log; build=${{ needs.build.result }}" > res/round2/build-log.txt
            git -C res add -A && git -C res -c user.name=kloo-ci -c user.email=kloo-ci@users.noreply.github.com commit -q -m "round2 build log [skip ci]" || break
            git -C res push -q origin ci/speech-results && break
            sleep $((RANDOM % 20 + 5))
          done
